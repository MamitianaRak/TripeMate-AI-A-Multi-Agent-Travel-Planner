# Render Blueprint: managed PostgreSQL, Docker API service and static frontend.
# Secrets marked `sync: false` are asked for when the Blueprint is created.
databases:
  - name: tripmate-db
    plan: free
    databaseName: tripmate
    user: tripmate

services:
  - type: web
    name: tripmate-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tripmate-db
          property: connectionString
      - key: DATABASE_SSLMODE
        value: require
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: RATE_LIMIT_REQUESTS
        value: "10"
      - key: CORS_ORIGINS
        sync: false # e.g. https://tripmate-web.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AVIATIONSTACK_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false

  - type: web
    name: tripmate-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # e.g. https://tripmate-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
