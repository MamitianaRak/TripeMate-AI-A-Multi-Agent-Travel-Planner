# Full local stack: PostgreSQL + API + frontend (nginx).
#   cp .env.example .env   # fill in the API keys
#   docker compose up --build
#   open http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tripmate
      POSTGRES_PASSWORD: tripmate
      POSTGRES_DB: tripmate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripmate -d tripmate"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tripmate:tripmate@db:5432/tripmate
      DATABASE_SSLMODE: disable
      CORS_ORIGINS: http://localhost:8080
      TRUST_PROXY_HEADERS: "true"
      LOG_JSON: "true"
      ENVIRONMENT: docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    environment:
      API_UPSTREAM: http://api:8000
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
