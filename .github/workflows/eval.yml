name: Trajectory evaluation

# Runs the trajectory evaluation against the real LLM, with the specialists' external APIs
# stubbed (the AviationStack free plan allows 100 requests a month). Not on every push: it uses
# the Groq free tier, so the cases are spaced out. Run it by hand before merging a prompt or
# model change, and weekly to catch provider-side drift.
on:
  workflow_dispatch:
    inputs:
      min_pass:
        description: "Fail below this pass rate (0-1)"
        default: "0.9"
  schedule:
    - cron: "0 8 * * 1"  # Mondays 08:00 UTC

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY != '' }}
      LANGSMITH_PROJECT: tripmate-eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the evaluation
        run: python -m evals.run --delay 15 --min-pass "${{ inputs.min_pass || '0.9' }}"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
